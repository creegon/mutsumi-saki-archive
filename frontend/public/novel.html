87,"textCount":12861,"wordCount":7062,"createDate":"2025-06-13T14:07:46+09:00","updateDate":"2025-06-13T14:08:57+09:00","tags":["R-18","睦祥","若叶睦","丰川祥子","中国语","futanari","豊川祥子","若葉睦","BanG_Dream!","むつさき"],"description":"*逐渐变化成狼人的睦x宠姐无下限的祥子<br />*亲姐妹骨科<br />*注:这章睦有挂件，睦有挂件⚠️<br />*丰川爸爸死亡预警。<br /><br />总于写完了，这本写到后面自己也迷茫了，亲姐妹相爱还要狼人变异还弑杀了血亲，这后面怎么收场啊？<br /><br />但写着写着人物好像有了她们自己的行动，最后留下了这个结尾，希望大家喜欢。<br /><br />后续还会写个后记，交代一下故事开头和蓝发女人什么情况，为什么祥子的家会有那本书籍。或许细心的读者已经发现了真相？<br /><br />再次感谢阅读，下个睦祥的故事见。","url":"https://www.pixiv.net/novel/show.php?id=25039342"},{"id":"24249120","title":"觊觎 4","author":"吔我十三香啦","authorId":"114189861","bookmarks":186,"textCount":3701,"wordCount":2076,"createDate":"2025-03-11T23:36:39+09:00","updateDate":"2025-03-11T23:36:39+09:00","tags":["R-18","豊川祥子","若葉睦","ABO","睦祥","Futanari","百合","丰川祥子","若叶睦","むつさき"],"description":"亲姐妹架空 abo（逐渐沦为背景板）ooc<br />这篇是睦努力用嘴满足祥的故事<br />本来想要快进这种部分直接写不加掩饰欲望的性爱<br />但……果然调教还是得慢慢来吧hhh","url":"https://www.pixiv.net/novel/show.php?id=24249120"},{"id":"26465221","title":"【睦祥】Room No.9 ？「Day 8」","author":"星风","authorId":"37878489","bookmarks":185,"textCount":10690,"wordCount":5847,"createDate":"2025-11-15T17:37:11+09:00","updateDate":"2025-11-15T19:07:38+09:00","tags":["R-18","むつさき","睦祥","若叶睦","豊川祥子","若葉睦","丰川祥子","futanari","九号房","BanG_Dream!"],"description":"*魔改九号房<br />*睦有挂件请注意⚠️<br />*play的不知天地为何物了……已让我无法直视钢琴，我是怎么用钢琴写出六七千字的玩法，太可怕了。<br /><br />*本章引用了的钢琴曲，全部现实真的存在。<br /><br />Ps：<br />关于文内的诗篇，原文是德文，这是c老师的中翻，感觉太适合睦祥了，于是敲定了这首歌曲。<br /><br />《只要你还能爱，就请去爱》<br />—<br />只要你还能爱，就请去爱；<br />只要你愿意爱，就请去爱！<br />那时刻终会来临，而且一定会来——<br />到那时，你只能站在坟前哭泣。<br /><br />趁你的心还在燃烧，<br />趁它还能怀有爱、给予爱，<br />趁还有另一颗心<br />愿在你张开的臂弯里跳动——<br />请去爱吧。<br /><br />当有人向你敞开胸怀，<br />请为他尽你所能地温柔；<br />让他每一小时都欢喜，<br />别让任何一个小时变得阴暗。<br /><br />请谨慎你的言语，<br />一句伤人的话太容易说出口。<br />天啊，那本不是你的本意——<br />可对方却已经带着伤痛离开。<br /><br />只要你还能爱，就请去爱；<br />只要你愿意爱，就请去爱！<br />那时刻终会来临，而且一定会来——<br />到那时，你只能站在坟前哭泣。<br /><br />你将回想起所有匆忙说出的每一句话，<br />即使你的心仍然温热如昔，<br />但那另一个人已冰冷，<br />如同墓穴般沉寂无声。<br / ,"むつさき","さきむつ","若葉睦","豊川祥子","BanG_Dream!"],"description":"","url":"https://www.pixiv.net/novel/show.php?id=24783542"},{"id":"27136225","title":"【睦祥】Room No.9?「Day10 」End.","author":"星风","authorId":"37878489","bookmarks":159,"textCount":7708,"wordCount":4017,"createDate":"2026-01-29T20:15:57+09:00","updateDate":"2026-01-29T20:20:36+09:00","tags":["R-18","睦祥","若叶睦","丰川祥子","豊川祥子","若葉睦","BanG_Dream!","九号房","ふたなり","むつさき"],"description":"*魔改九号房<br />*睦有挂件请注意⚠️<br />*本篇有窒息等让人不适的场景⚠️<br /><br />终于写完这篇了，要说的话太多了反而不知道怎么说了。<br /><br />每一天的选项除了肉体和精神的二选一，其实都多少有些对比。<br /><br />稍微说一下就是：<br /><br />Day1的要么在手臂留下名字，要么牵手，都是一种归属与确认的对比。<br /><br />Day2的抽血与对视，是一种血液流出，对视而入，一种进入与流出的感觉。<br /><br />Day3的窒息和拥抱，一种是夺取生命，一种是确认生命。<br /><br />Day4的烙印和亲吻，是生理或者心理留下印记的一种。<br /><br />Day5的都是手，这个比较好理解交给你猜猜啦～<br /><br />Day6的都是刺瞎眼和进入身体，都是一种进入的伤害行为，所以在这里我故意设置了祥蒙着睦的眼睛，就像眼睛没被刺瞎，身体也没被进入的自欺欺人感。<br /><br />Day7的要么物理在脸上划面具，和带着面具场景do的，都是一种隐喻。带着面具就能隐藏本心，那do的时候就没有心理压力。但如果是选项一，划出来的伤口反而展现了皮下的真心。<br /><br />Day8的是耳膜和钢琴曲，其实都是对声音。一个是从此世界里不再有喜欢的声音，一个是喜欢的声音里包括了扭曲黑暗的感情。所以三首钢琴曲都进行挑选了，从祥子演奏命运开始，到小星星的童年，最后是睦弹奏的爱之梦。她们本身就是幼驯染➕都会钢琴，而乐器是乐者最深情的表达，于是在这章里花了好多的小心思，算是最满意的小章了。<br /><br />Day9的是舌头x精浴，这个比较复杂，有食欲和x欲的对比，又要气味和品尝的那种感觉。（但其实这个有点强行所以是我9个选项里最不满意的选项一。）<br /><br />最后是一早就注定的收尾选项，关于祥子和睦最大的命题，【死亡】和【遗忘】，可以说一开始就是为了这点醋包的饺子，所以一直迟迟不懂得如何下笔，但最后还是写出来了，希望能喜欢这一场结局。<br /><br />感谢观看到这里，下一篇睦祥文见。（2.14）","url":"https://www.pixiv.net/novel/show.php?id=27136225"},{"id":"26033505","title":"【睦祥睦】食欲 (上)","author":"星风","authorId":"37878489","bookmarks":159,"textCount":8003,"wordCount":4249,"createDate":"2025-09-27T17:10:26+09:00","updateDate":"2025-09-27T19:54:33+09:00","tags":["R-18","祥睦","豊川祥子","若葉睦","さきむつ","むつさき","百合","BanG_Dream!","Fork_Cake"],"description":"*引用了Fork&amp;Cake的世界观。<br />*丰川集团总裁祥子x大明星睦。<br /><br />*年龄操作，祥子大了睦五岁，所以她们的童年错过了幼驯染时期。<br /><br />*因为睦祥没有相遇且年龄不同，这个时期的祥子提前羽翼丰满，继承了丰川集团，而睦没有和吉他相遇，走向了明星这条父母精心打造的道路。<br /><br />*隐晦的吃人描写，雷者注意⚠️<br /><br />*ooc请见谅。","url":"https://www.pixiv.net/novel/show.php?id=26033505"},{"id":"26684043","title":"【睦 ":"2025-01-30T19:21:22+09:00","tags":["R-18G","むつさき","Ave_Mujica","若葉睦","豊川祥子","R18","R18G","BanG_Dream!"],"description":"","url":"https://www.pixiv.net/novel/show.php?id=23923610"},{"id":"24320671","title":"调教 XI · 因为年幼所以残忍？","author":"己を知るSomniorum","authorId":"114477159","bookmarks":38,"textCount":18799,"wordCount":9902,"createDate":"2025-03-20T17:35:51+09:00","updateDate":"2025-03-20T20:01:33+09:00","tags":["R-18","百合","BanG_Dream!","Ave_Mujica","ういさき","さきうい","まなうい","むつさき","むつうい"],"description":"究极 OOC？沾点 4P 警告。<br />其实这个系列，是真的应该按照序号写、按照序号读的，只是这样的话，就来不及向各位读者表明，我这 OOC 的人设与剧情，早就在开始写这个系列的时候，在第11集播出之前，就全想好了。<br />要是等第12集出来，OOC 的程度突然就减轻了一丢丢，那可……<br /><br />这一篇是整个系列的最重要的一篇，看过这一篇，其他的本来就没什么的篇章，就更没可能有什么惊喜感了……<br />真的有4页，但沾点 4P 也是真的，tag不是乱打的。<br />只想看一对一纯爱的读者，还请只看第一页就好（也没纯到哪去……<br /><br />可怜的小初华，就像一只刚出壳的夜莺，第一眼，就看到了其实不该看到的人。<br />被关入笼中的她，不在乎美味佳肴，也不在乎琼浆玉液，精美的笼牢和自由的风，其实都一样的不太在意。<br />她眼中所视，心中所求的，从来只是主人的一颦一笑，一举一动，这笼牢，正是她渴求的全世界。<br />可她的主人呢？因为年幼所以残忍？又或是说……<br /><br />差不多是这种感觉的故事……基本上没可能写的太出来这种氛围就是了……<br /><br />关于会在第3页出场的真奈，带了点私设？还带了小道具？<br />祥子从小就是个很有好奇心的孩子，一旦好奇了，就一定要查到水落石出为止......可怜的小睦......合掌。这一点原本打算写出来的，不过睦的话一直不多，所以最后就没找到合适的时机加进去了","url":"https://www.pixiv.net/novel/show.php?id=24320671"},{"id":"23815062","title":"我的天枰 第三章","author":"JK","authorId":"3138553","bookmarks":37,"textCount":3172,"wordCount":1701,"createDate":"2025-01-14T20:43:16+09:00","updateDate":"2025-01-14T20:43:16+09:00","tags":["R-18G","むつさき","Ave_Mujica","若葉睦","豊川祥子","R18","R18G","BanG_Dream!"],"description":"终于赶上宝宝的生日了！<br /><br />我的天枰 第三章（含有一些三集剧透）<br /> <br />预警： <br /> <br />第一人称视角，含有血腥暴力，封建迷信要素，（以及或许会有色情要素）但这些非清水的黑暗情节并不是作者主要想表达的内容。<br /><br />本章有可能让人不适的血腥描写，但死者罪有应得 。<br /> <br />有部分设定参考了游戏《Life Eater》。 <br /><br />CP为睦祥不拆不逆，某种程度上，不推荐没有看过三集的人看。 <br /> <br />不过由于作者是懒鬼，或许写完特殊剧情，大家都看完了。","url":"https://www.pixiv.net/novel/show.php?id=23815062"},{"id":"25894244","title":"［睦祥］渴海蚀月","author":"宁作吾","authorId":"69642117","bookmarks":36,"textCount":4488,"wordCount":2149,"createDate":"2025-09-13T21:16:34+09:00" // ===== State =====
let state = {
  search: '',
  sort: 'bookmarks',
  author: '',
  activeTags: new Set(),
};

// ===== Init =====
function init() {
  // Populate author select
  const authorSel = document.getElementById('authorSelect');
  ALL_AUTHORS.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    authorSel.appendChild(opt);
  });

  // Populate tag bar
  const tagBar = document.getElementById('tagBar');
  // Popular/notable tags to feature
  const featuredTags = ALL_TAGS.filter(t => !['むつさき','若葉睦','豊川祥子','BanG_Dream!','Ave_Mujica','MyGO!!!!!','mygo','AveMujica','Ave_mujica'].includes(t));
  
  featuredTags.slice(0, 25).forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'tag-chip';
    chip.dataset.tag = tag;
    const isR18 = tag.startsWith('R-18') || tag === 'R18' || tag === 'R18G' || tag === 'r18';
    chip.innerHTML = `${tag} <span class="count">${countTag(tag)}</span>`;
    chip.addEventListener('click', () => toggleTag(tag));
    tagBar.appendChild(chip);
  });

  const clearBtn = document.createElement('button');
  clearBtn.className = 'clear-btn';
  clearBtn.textContent = '× 清除筛选';
  clearBtn.addEventListener('click', clearFilters);
  tagBar.appendChild(clearBtn);

  // Event listeners
  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value.trim();
    render();
  });
  document.getElementById('sortSelect').addEventListener('change', e => {
    state.sort = e.target.value;
    render();
  });
  document.getElementById('authorSelect').addEventListener('change', e => {
    state.author = e.target.value;
    render();
  });

  render();
}

function countTag(tag) {
  return NOVELS.filter(n => n.tags.includes(tag)).length;
}

function toggleTag(tag) {
  if (state.activeTags.has(tag)) {
    state.activeTags.delete(tag);
  } else {
    state.activeTags.add(tag);
  }
  // Update chip appearance
  document.querySelectorAll('.tag-chip').forEach(chip => {
    if (chip.dataset.tag === tag) {
      chip.classList.toggle('active', state.activeTags.has(tag));
    }
  });
  render();
}

function clearFilters() {
  state.search = '';
  state.author = '';
  state.activeTags.clear();
  document.getElementById('searchInput').value = '';
  document.getElementById('authorSelect').value = '';
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  render();
}

// ===== Filter & Sort =====
function getFiltered() {
  let result = NOVELS;
  const q = state.search.toLowerCase();

  if (q) {
    result = result.filter(n =>
      n.title.toLowerCase().includes(q) ||
      n.author.toLowerCase().includes(q)
    );
  }
  if (state.author) {
    result = result.filter(n => n.author === state.author);
  }
  if (state.activeTags.size > 0) {
    result = result.filter(n =>
      [...state.activeTags].every(tag => n.tags.includes(tag))
    );
  }

  // Sort
  result = [...result];
  if (state.sort === 'bookmarks') {
    result.sort((a, b) => b.bookmarks - a.bookmarks);
  } else if (state.sort === 'date') {
    result.sort((a, b) => new Date(b.createDate) - new Date(a.createDate));
  } else if (state.sort === 'wordcount') {
    result.sort((a, b) => b.textCount - a.textCount);
  }

  return result;
}

// ===== Render =====
function formatDate(iso) {
  if (!iso) return '';
  return iso.slice(0, 10);
}

function formatNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function isR18Tag(tag) {
  return ['R-18','R18','R-18G','R18G','r18','r18g'].includes(tag);
}

function renderCard(novel) {
  const div = document.createElement('div');
  div.className = 'novel-card';

  // Title
  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = novel.title;
  div.appendChild(title);

  // Author
  const author = document.createElement('div');
  author.className = 'card-author';
  author.innerHTML = `作者：<span>${escapeHtml(novel.author)}</span>`;
  div.appendChild(author);

  // Meta: bookmarks + wordcount
  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.innerHTML = `
    <div class="meta-item bookmarks">
      <svg class="meta-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      ${formatNum(novel.bookmarks)}
    </div>
    <div class="meta-item wordcount">
      <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      ${formatNum(novel.textCount)} 字
    </div>
  `;
  div.appendChild(meta);

  // Tags (show meaningful ones, limit to 6)
  const displayTags = novel.tags.filter(t => !['若葉睦','豊川祥子','BanG_Dream!','むつさき'].includes(t)).slice(0, 6);
  if (displayTags.length > 0) {
    const tagsDiv = document.createElement('div');
    tagsDiv.className = 'card-tags';
    displayTags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'novel-tag' + (isR18Tag(tag) ? ' r18' : '');
      span.textContent = tag;
      span.addEventListener('click', () => {
        // Add to filter
        if (!state.activeTags.has(tag)) {
          state.activeTags.add(tag);
          document.querySelectorAll('.tag-chip').forEach(c => {
            if (c.dataset.tag === tag) c.classList.add('active');
          });
          render();
        }
      });
      tagsDiv.appendChild(span);
    });
    div.appendChild(tagsDiv);
  }

  // Footer: date + link
  const footer = document.createElement('div');
  footer.className = 'card-footer';
  footer.innerHTML = `
    <span class="card-date">📅 ${formatDate(novel.createDate)}</span>
    <a href="${novel.url}" target="_blank" rel="noopener" class="pixiv-link">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      去 pixiv 看
    </a>
  `;
  div.appendChild(footer);

  return div;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('novelGrid');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');

  resultCount.innerHTML = `<span>${filtered.length}</span> 篇`;

  grid.innerHTML = '';
  if (filtered.length === 0) {
    emptyState.style.display = '';
  } else {
    emptyState.style.display = 'none';
    // Use DocumentFragment for perf
    const frag = document.createDocumentFragment();
    filtered.forEach(novel => frag.appendChild(renderCard(novel)));
    grid.appendChild(frag);
  }
}

// Start
init();
</script>
</body>
</html>
