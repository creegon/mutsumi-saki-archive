version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mutsumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mutsumi
      POSTGRES_PASSWORD: mutsumi_secret_2024
      POSTGRES_DB: mutsumi_archive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutsumi -d mutsumi_archive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mutsumi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
